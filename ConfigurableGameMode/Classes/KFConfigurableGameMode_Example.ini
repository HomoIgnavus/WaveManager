; These are spawned after all the spawns from SpawnPresets.Regular finish.
; At the beginning each wave, one group is randomly selected and all the spawns in that group are spawned.
; This could be used to simulate the vanilla special waves, e.g. scrake, bloat, husk waves, in endless mode.
;
; The chance of each group being selected = frequency of that group / sum of frequencies of all groups.
; e.g. if you have Group=(Number=0, frequency=1) and Group=(Number=1, frequency=2), then the chance of Group 0 being selected is 1/(1+2) = 33.3%, 
;  and the chance of Group 1 being selected is 2/(1+2) = 66.6%.
