ExtraXpPerWave=(Setup=0, Value=0.5)
DoshScale=(Setup=0, Value=1.0)              ; Multiplier of the amount of Dosh players receive.
ExtraSpawnPerWave=(Setup=0, Value=1.0)     ; Additional spawns per wave.
ExtraSpawnPerPlayer=(Setup=0, Value=0.75)    ; Additional spawns per player.
MaxAlive=(Setup=0, Value=30)                ; Maximum number of Zeds alive at once.
Interval=(Setup=0, Value=10)                 ; Interval for interval waves.
ZedHealthScale=(Setup=0, Value=1.0)         ; Base health scale for Zeds from the first wave. 
ExtraHealthPerWave=(Setup=0, Value=0.05)     ; Additional health scale per wave, added to the base health scale.
ExtraHealthPerPlayer=(Setup=0, Value=0.5)   ; Additional health scale per player, added to the base health scale.
MaxHealthScale=(Setup=0, Value=10.0)        ; Maximum health scale that can be reached by adding the extra health per wave and per player. 0 for no limit.
ZedResistanceScale=(Setup=0, Value=1.0)
ExtraResistancePerWave=(Setup=0, Value=0.0)
