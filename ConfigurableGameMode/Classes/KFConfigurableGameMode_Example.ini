ExtraSpeedPerWave=(Setup=0, Value=0.05)
MaxSpeedScale=(Setup=0, Value=10.0)
bUseStockScaling=(Setup=0, Value=false)     ; If set to true, the vanilla scaling will be applied first and then multiplied by the custom scaling values.
bEnableBossWaves=(Setup=0, Value=false)      ; When enabled, interval waves will behave like the boss waves in vanilla endless mode.

